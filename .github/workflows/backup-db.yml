name: Backup de la base

# Backup diario de la base de producción (Postgres en Railway) a un bucket
# S3-compatible SOLO para backups (separado del de comprobantes). Hoy ese bucket
# es un Storage Bucket de Railway; si algún día se quiere la copia fuera de
# Railway, alcanza con cambiar los secrets para que apunten a otro proveedor
# S3-compatible (Cloudflare, AWS, etc.) -- el workflow no cambia.
#
# Secrets que hay que cargar en GitHub (Settings > Secrets and variables >
# Actions):
#   BACKUP_DATABASE_URL         DATABASE_PUBLIC_URL del servicio Postgres en Railway
#   BACKUP_S3_ENDPOINT_URL      ENDPOINT del bucket de backups (pestaña Credentials)
#   BACKUP_S3_ACCESS_KEY_ID     ACCESS_KEY_ID del bucket de backups
#   BACKUP_S3_SECRET_ACCESS_KEY SECRET_ACCESS_KEY del bucket de backups
#   BACKUP_S3_BUCKET            BUCKET del bucket de backups (no el nombre visible)
# Variables opcionales:
#   BACKUP_S3_REGION            REGION del bucket (default "auto")
#   BACKUP_S3_ADDRESSING_STYLE  "virtual" (default) o "path"
#   PG_MAJOR                    versión mayor del Postgres de Railway (default 17).
#                               pg_dump tiene que ser igual o más nuevo que el server.
#
# Retención: acá no se borra nada; borrar a mano los dumps viejos de vez en
# cuando (o con una regla de lifecycle si el proveedor la tiene).
#
# Restaurar (pisa los datos de la base destino):
#   aws s3 cp s3://$BACKUP_S3_BUCKET/<archivo>.sql.gz . --endpoint-url $BACKUP_S3_ENDPOINT_URL
#   gunzip -c <archivo>.sql.gz | psql "$DATABASE_URL"

on:
  schedule:
    - cron: "17 6 * * *" # todos los días, 03:17 en Argentina
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      PG_MAJOR: ${{ vars.PG_MAJOR || '17' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION || 'auto' }}
      S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT_URL }}
      S3_ADDRESSING_STYLE: ${{ vars.BACKUP_S3_ADDRESSING_STYLE || 'virtual' }}
      BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
    steps:
      # Hasta que se carguen los secrets, el cron no falla todos los días:
      # avisa y sale.
      - name: Chequear configuración
        id: config
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BUCKET" ]; then
            echo "::warning::Faltan BACKUP_DATABASE_URL o BACKUP_S3_BUCKET; no se hace el backup."
            echo "listo=false" >> "$GITHUB_OUTPUT"
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi

      - name: pg_dump
        if: steps.config.outputs.listo == 'true'
        # shell: bash explícito activa pipefail: si pg_dump falla, falla el paso.
        shell: bash
        run: |
          ARCHIVO="homesolutions_$(date -u +%Y%m%d_%H%M%S).sql.gz"
          docker run --rm "postgres:${PG_MAJOR}" \
            pg_dump "$DATABASE_URL" --format=plain --no-owner --no-privileges \
            | gzip > "$ARCHIVO"
          # Un dump vacío o cortado pesa casi nada: mejor fallar que subirlo.
          test "$(stat -c %s "$ARCHIVO")" -gt 1000
          echo "ARCHIVO=$ARCHIVO" >> "$GITHUB_ENV"
          ls -lh "$ARCHIVO"

      - name: Subir al bucket de backups
        if: steps.config.outputs.listo == 'true'
        run: |
          aws configure set default.s3.addressing_style "$S3_ADDRESSING_STYLE"
          aws s3 cp "$ARCHIVO" "s3://$BUCKET/$ARCHIVO" --endpoint-url "$S3_ENDPOINT"
