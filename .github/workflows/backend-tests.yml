name: Backend Tests

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Misma imagen oficial de Docker Hub, pero servida desde el mirror
        # público de AWS ECR: Docker Hub corta las descargas anónimas por IP
        # (toomanyrequests) y los runners de GitHub comparten IP con muchos
        # otros repos, así que el job fallaba antes de correr un solo test.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homesolutionsdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      database_host: localhost
      database_port: 5432
      database_user: postgres
      database_password: postgres
      database_name: homesolutionsdb
      SECRET_KEY: ci-secret-key-solo-para-tests-no-usar-en-produccion-123456
      ALGORITHM: HS256

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Correr pytest
        working-directory: backend
        run: pytest

      # D-04: no-bloqueante a propósito -- black/isort recién se agregaron
      # (ver pyproject.toml) y todavía no hay un hábito de correrlos antes de
      # cada commit. Que el check falle en rojo desde el día 1 sin que nadie
      # lo haya pedido generaría más ruido que valor; continue-on-error deja
      # la señal visible en el summary del run sin bloquear el merge.
      - name: Chequear formato (black + isort) -- no bloqueante
        working-directory: backend
        continue-on-error: true
        run: |
          black --check app tests
          isort --check-only app tests
