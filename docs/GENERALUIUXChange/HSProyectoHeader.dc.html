<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:20px;font-family:'Public Sans',sans-serif;color:#000000">
<div style="display:flex;flex-direction:column;gap:8px">
<div style="display:flex;align-items:center;gap:6px;font-size:13px;color:#5a5a58"><span>Proyectos</span><span style="color:#d9d7d2">/</span><span style="color:#000000;font-weight:500">Edificio Olleros</span></div>
<div style="display:flex;align-items:center;gap:12px">
<h1 style="margin:0;font-size:28px;font-weight:700;letter-spacing:-0.02em">Edificio Olleros</h1>
<span style="font-size:12px;font-weight:600;line-height:22px;padding:0 8px;border-radius:4px;background:#eef0e3;color:#4f5b30">En curso</span>
</div>
<div style="display:flex;flex-wrap:wrap;gap:6px 20px;font-size:14px;color:#5a5a58">
<span style="display:flex;align-items:center;gap:6px">{{ i.pin }}Olleros 1925, CABA</span>
<span style="display:flex;align-items:center;gap:6px">{{ i.cal }}Desde el 10/03/2026</span>
<span style="display:flex;align-items:center;gap:6px">{{ i.layers }}Fase 3 de 4 · Montaje</span>
</div>
</div>
<div style="display:flex;gap:28px;border-bottom:1px solid #e6e4df">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
<a style="display:flex;align-items:center;gap:8px;height:40px;border-bottom:2px solid {{ t.line }};margin-bottom:-1px;font-size:14px;font-weight:{{ t.weight }};color:{{ t.color }};text-decoration:none;cursor:pointer">{{ t.icon }}{{ t.label }}<sc-if value="{{ t.hasBadge }}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;font-weight:700;line-height:18px;min-width:18px;text-align:center;border-radius:99px;background:#fef3e2;color:#9a4a07">{{ t.badge }}</span></sc-if></a>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:968,&quot;height&quot;:160},&quot;tab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Fases&quot;,&quot;Acciones&quot;,&quot;Análisis&quot;,&quot;Seguimiento&quot;],&quot;default&quot;:&quot;Fases&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const P={
pin:'<path d="M20 10c0 4.99-5.54 10.19-7.4 11.8a1 1 0 0 1-1.2 0C9.54 20.19 4 14.99 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
cal:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
layers:'<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>',
arrows:'<path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/>',
chart:'<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
bell:'<path d="M10.27 21a2 2 0 0 0 3.46 0"/><path d="M3.26 15.33A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.67C19.41 13.96 18 12.5 18 8A6 6 0 0 0 6 8c0 4.5-1.41 5.96-2.74 7.33"/>'
};
const ic=(n,s=16)=>React.createElement('svg',{width:s,height:s,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:1.75,strokeLinecap:'round',strokeLinejoin:'round',style:{flex:'none',display:'block'},dangerouslySetInnerHTML:{__html:P[n]}});
const T=[['Fases','Fases del proyecto','layers'],['Acciones','Acciones','arrows'],['Análisis','Análisis general','chart'],['Seguimiento','Seguimiento','bell']];
class Component extends DCLogic {
  renderVals(){
    const a=this.props.tab??'Fases';
    return {
      i:{pin:ic('pin',15),cal:ic('cal',15),layers:ic('layers',15)},
      tabs:T.map(([k,l,n])=>{const on=k===a;return {label:l,icon:ic(n,15),line:on?'#6f7f45':'transparent',color:on?'#000000':'#5a5a58',weight:on?600:500,hasBadge:k==='Seguimiento',badge:'8'};})
    };
  }
}
</script>
</body>
</html>
