<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<aside style="width:232px;height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:24px;padding:24px 16px 16px;border-right:1px solid #e6e4df;background:#ffffff;font-family:'Public Sans',sans-serif;color:#000000">
<div style="display:flex;align-items:center;gap:10px;padding:0 8px">
<svg width="28" height="28" viewBox="0 0 24 24" style="flex:none"><path d="M12 2.6 3.4 9.2v10.3a2 2 0 0 0 2 2h13.2a2 2 0 0 0 2-2V9.2Z" fill="none" stroke="#000000" stroke-width="2.2" stroke-linejoin="round"></path><text x="12" y="18.2" text-anchor="middle" font-size="11" font-weight="700" font-family="Public Sans" fill="#000000">S</text></svg>
<span style="font-size:13px;font-weight:700;line-height:1.1">Home<br>Solutions</span>
</div>
<nav style="display:flex;flex-direction:column;gap:2px">
<sc-for list="{{ items }}" as="n" hint-placeholder-count="5">
<a style="display:flex;align-items:center;gap:12px;height:36px;padding:0 8px;border-radius:6px;font-size:14px;font-weight:{{ n.weight }};color:{{ n.color }};background:{{ n.bg }};text-decoration:none;cursor:pointer" style-hover="background:#f3f2ee">{{ n.icon }}<span style="flex:1">{{ n.label }}</span><span style="font-size:12px;color:#8c8b86">{{ n.count }}</span></a>
</sc-for>
</nav>
<div style="display:flex;flex-direction:column;gap:2px">
<span style="padding:0 8px 6px;font-size:12px;font-weight:600;color:#8c8b86">En curso</span>
<sc-for list="{{ projects }}" as="p" hint-placeholder-count="3">
<a style="display:flex;align-items:center;gap:10px;min-height:32px;padding:4px 8px;border-radius:6px;font-size:13px;font-weight:{{ p.weight }};color:#000000;background:{{ p.bg }};text-decoration:none;cursor:pointer" style-hover="background:#f3f2ee"><span style="width:7px;height:7px;border-radius:99px;flex:none;background:{{ p.dot }}"></span><span style="text-wrap:pretty">{{ p.name }}</span></a>
</sc-for>
</div>
<div style="flex:1"></div>
<div style="display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid #e6e4df">
<span style="width:32px;height:32px;border-radius:99px;background:#eef0e3;color:#4f5b30;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700">AG</span>
<div style="display:flex;flex-direction:column;flex:1"><span style="font-size:14px;font-weight:600">Agustín</span><span style="font-size:12px;color:#5a5a58">Admin</span></div>
<span title="Salir" style="color:#8c8b86;display:flex">{{ logout }}</span>
</div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:232,&quot;height&quot;:820},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Panel&quot;,&quot;Proyectos&quot;,&quot;Proveedores&quot;,&quot;Catálogos&quot;,&quot;Comparador&quot;],&quot;default&quot;:&quot;Proyectos&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;project&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const P={
grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
building:'<path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4M10 10h4M10 14h4M10 18h4"/>',
truck:'<path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62L18.3 9.38a1 1 0 0 0-.78-.38H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>',
tag:'<path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><circle cx="7.5" cy="7.5" r=".5"/>',
compare:'<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><path d="M11 18H8a2 2 0 0 1-2-2V9"/>',
logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>'
};
const ic=(n,s=16)=>React.createElement('svg',{width:s,height:s,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:1.75,strokeLinecap:'round',strokeLinejoin:'round',style:{flex:'none',display:'block'},dangerouslySetInnerHTML:{__html:P[n]}});
const NAV=[['Panel','grid',''],['Proyectos','building','5'],['Proveedores','truck','11'],['Catálogos','tag',''],['Comparador','compare','']];
const PR=[['Torre Libertador · Climatización','#dc2626'],['Edificio Olleros','#6f7f45'],['Casa Terravista L514','#6f7f45']];
class Component extends DCLogic {
  renderVals(){
    const a=this.props.active??'Proyectos',pa=this.props.project??'';
    return {
      items:NAV.map(([l,n,c])=>{const on=l===a;return {label:l,count:c,icon:ic(n),color:on?'#6f7f45':'#5a5a58',bg:on?'#f1f2ea':'transparent',weight:on?600:500};}),
      projects:PR.map(([name,dot])=>{const on=name===pa;return {name,dot,bg:on?'#f3f2ee':'transparent',weight:on?600:400};}),
      logout:ic('logout')
    };
  }
}
</script>
</body>
</html>
