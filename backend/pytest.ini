[pytest]
; Agrega la raíz del backend a sys.path para que "from app... import ..."
; funcione sin importar desde qué carpeta se invoque pytest.
pythonpath = .
testpaths = tests

; passlib usa el módulo "crypt" de la stdlib, deprecado desde Python 3.13.
; No es nuestro código -- se soluciona cuando passlib actualice, no antes.
; Se silencia acá para no ensuciar la salida de los tests.
filterwarnings =
    ignore:'crypt' is deprecated and slated for removal in Python 3\.13:DeprecationWarning
