[tool.black]
# 110 en vez del default (88): el estilo del repo ya usa líneas más largas
# a propósito (comentarios en español bien descriptivos, firmas de rutas
# con varios parámetros) -- 88 hubiera generado un reformateo mucho más
# agresivo sin agregar legibilidad real.
line-length = 110
target-version = ["py312"]

[tool.isort]
# profile "black" ordena los imports de forma compatible con cómo black
# formatea el resto -- sin esto, los dos tools pueden "pelearse" reformateando
# la misma línea en loop.
profile = "black"
line_length = 110

[tool.pytest.ini_options]
# Agrega la raíz del backend a sys.path para que "from app... import ..."
# funcione sin importar desde qué carpeta se invoque pytest.
pythonpath = ["."]
testpaths = ["tests"]
# passlib usa el módulo "crypt" de la stdlib, deprecado desde Python 3.13.
# No es nuestro código -- se soluciona cuando passlib actualice, no antes.
# Se silencia acá para no ensuciar la salida de los tests.
filterwarnings = [
    "ignore:'crypt' is deprecated and slated for removal in Python 3\\.13:DeprecationWarning",
]
